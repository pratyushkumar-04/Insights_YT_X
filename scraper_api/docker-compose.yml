version: "3.9"

services:
  scraper-api:
    build:
      context: .
    container_name: scraper-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Scraper API"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "development"
      DEBUG: "true"
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
